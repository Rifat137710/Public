name: Deploy Bus 18

on:
  push:
    branches: [claude/hello-vj564a, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Scoped per branch. A single shared "pages" group meant that pushing the feature branch
# straight after main put both runs in the same group, and cancel-in-progress killed the
# main run — silently, with a green branch run next to it, leaving the live site on the
# previous commit. Only main can deploy anyway, so nothing is gained by having the two
# contend.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify the physics before shipping it
        run: npm test
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  # Pages only accepts a deployment from the default branch, so on any other branch this
  # job failed after a second and painted the whole run red. The build above is the part
  # that is useful there; skipping the deploy makes a red branch run mean something.
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
